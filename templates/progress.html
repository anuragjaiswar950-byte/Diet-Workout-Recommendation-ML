<!DOCTYPE html>
<html>
<head>
    <title>Progress Tracker</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f3f4f6;
            padding: 40px 20px;
        }

        .table-container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th {
            background: #14b8a6;
            color: white;
            font-weight: 600;
        }

        tr:hover { background-color: #f9fafb; }

        h2 {
            text-align: center;
            color: #14b8a6;
            margin-bottom: 25px;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: #14b8a6;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="table-container">
    <h2>User Progress Database</h2>
    <a href="/" class="back-btn">← Back to Planner</a>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Date</th>
                <th>Weight</th>
                <th>Height</th>
                <th>BMI</th>
                <th>Category</th>
            </tr>
        </thead>
        <tbody>
            {% for row in rows %}
            <tr>
                <td>{{ row[0] }}</td>
                <td>{{ row[1] }}</td>
                <td>{{ row[2] }} kg</td>
                <td>{{ row[3] }} cm</td>
                <td>{{ row[4] }}</td>
                <td>{{ row[5] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
