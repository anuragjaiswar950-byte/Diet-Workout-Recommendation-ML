<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Fitness App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: url("{{ url_for('static', filename='images/gym_bg.jpg') }}") no-repeat center center fixed;
            background-size: cover;
            height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0;
        }
        body::before {
            content: ""; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6); z-index: -1;
        }
        .card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 40px; border-radius: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); width: 100%; max-width: 380px; text-align: center; }
        h2 { margin-bottom: 20px; color: #333; }
        .input-group { position: relative; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; padding-right: 40px; border: 2px solid #e2e8f0; border-radius: 10px; box-sizing: border-box; outline: none; transition: 0.3s; }
        input:focus { border-color: #4f46e5; }
        .password-toggle { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #888; }
        button { width: 100%; padding: 12px; background: linear-gradient(135deg, #4f46e5 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: 0.3s; }
        button:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(79, 70, 229, 0.4); }
        .footer { margin-top: 15px; font-size: 14px; color: #666; }
        a { color: #4f46e5; text-decoration: none; font-weight: bold; }
        .alert { padding: 10px; margin-bottom: 15px; border-radius: 5px; font-size: 14px; text-align: left;}
        .alert.error { background: #fee2e2; color: #991b1b; }
        .alert.success { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Create Account</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST">
            <div class="input-group"><input type="text" name="name" placeholder="Full Name" required></div>
            <div class="input-group"><input type="email" name="email" placeholder="Email" required></div>
            <div class="input-group"><input type="text" name="phone" placeholder="Phone (10 Digits)" maxlength="10" pattern="\d{10}" required></div>
            <div class="input-group">
                <input type="password" name="password" id="regPass" placeholder="Password (Min 8 chars)" required>
                <i class="fas fa-eye password-toggle" onclick="togglePassword('regPass', this)"></i>
            </div>
            <div class="input-group">
                <input type="password" name="confirm_password" id="confPass" placeholder="Confirm Password" required>
                <i class="fas fa-eye password-toggle" onclick="togglePassword('confPass', this)"></i>
            </div>
            <button type="submit">Sign Up</button>
        </form>
        <div class="footer">Already have an account? <a href="/login">Login here</a></div>
    </div>
    <script>
        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === "password") { input.type = "text"; icon.classList.replace("fa-eye", "fa-eye-slash"); }
            else { input.type = "password"; icon.classList.replace("fa-eye-slash", "fa-eye"); }
        }
    </script>
</body>
</html>
